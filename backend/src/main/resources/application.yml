spring:
  application:
    name: code-intelligence-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codeintel}
    username: ${SPRING_DATASOURCE_USERNAME:codeintel}
    password: ${SPRING_DATASOURCE_PASSWORD:codeintel}
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
repository:
  acquisition:
    workspace-root: ${REPOSITORY_ACQUISITION_ROOT:/tmp/code-intelligence-acquisitions}
    maximum-files: ${REPOSITORY_ACQUISITION_MAXIMUM_FILES:100000}
    maximum-expanded-bytes: ${REPOSITORY_ACQUISITION_MAXIMUM_BYTES:1073741824}
    maximum-file-bytes: ${REPOSITORY_ACQUISITION_MAXIMUM_FILE_BYTES:104857600}
  inventory:
    maximum-files: ${REPOSITORY_INVENTORY_MAXIMUM_FILES:100000}
    maximum-modules: ${REPOSITORY_INVENTORY_MAXIMUM_MODULES:500}
    maximum-pom-bytes: ${REPOSITORY_INVENTORY_MAXIMUM_POM_BYTES:2097152}
  connection:
    http-timeout: 10s
    public-allowed-hosts: github.com,gitlab.com,bitbucket.org
    github-app-id: ${GITHUB_APP_ID:0}
    github-private-key: ${GITHUB_APP_PRIVATE_KEY:}
    github-api: https://api.github.com
    zip-staging-root: ${REPOSITORY_ZIP_STAGING_ROOT:/tmp/code-intelligence-uploads}
    local-development-enabled: ${LOCAL_REPOSITORY_CONNECTIONS_ENABLED:false}
